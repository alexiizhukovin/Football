const TACTIC_SLOTS = {
  "2-1-1": ["FW", "FW", "MF", "DF", "GK"],
  "1-2-1": ["FW", "MF", "MF", "DF", "GK"],
  "1-1-2": ["FW", "MF", "DF", "DF", "GK"]
};
function ovr(p) {
  return Math.round((p.pac + p.phy + p.tec + p.vis + p.com) / 5);
}

// Build a lineup from squad + tactic.
// Returns {slots:[{player,slot,oop},...], bench:[...]}
// Players are assigned greedily: correct pos first, then OOP with penalty.
function buildLineup(squad, tactic) {
  const slots = TACTIC_SLOTS[tactic] || TACTIC_SLOTS["1-2-1"];
  const used = new Set();
  const result = [];

  // Pass 1: fill each slot with correct-position player
  const remaining = () => squad.filter(p => !used.has(p.id));
  for (const slot of slots) {
    const candidates = remaining().filter(p => p.pos === slot);
    if (candidates.length > 0) {
      const p = pick(candidates);
      used.add(p.id);
      result.push({
        player: {
          ...p,
          _slotPos: slot
        },
        slot,
        oop: false
      });
    } else {
      result.push({
        player: null,
        slot,
        oop: true
      }); // fill later
    }
  }

  // Pass 2: fill empty slots with OOP players
  for (let i = 0; i < result.length; i++) {
    if (!result[i].player) {
      const slot = result[i].slot;
      // Get all unused players; prefer non-GK for field slots
      const avail = squad.filter(p => !used.has(p.id));
      const preferred = slot === "GK" ? avail // for GK slot take anyone
      : avail.filter(p => p.pos !== "GK"); // for field slots avoid GK
      const p = pick(preferred.length > 0 ? preferred : avail);
      if (p) {
        used.add(p.id);
        const isOOP = p.pos !== slot; // только если позиция НЕ совпадает со слотом
        result[i].player = isOOP ? {
          ...p,
          pac: Math.round(p.pac * 0.85),
          phy: Math.round(p.phy * 0.85),
          tec: Math.round(p.tec * 0.85),
          vis: Math.round(p.vis * 0.85),
          com: Math.round(p.com * 0.85),
          _oop: true,
          _oopPos: slot,
          _slotPos: slot
        } : {
          ...p,
          _oop: false,
          _slotPos: slot // правильная позиция — без штрафа
        };
      }
    }
  }
  const bench = squad.filter(p => !used.has(p.id));
  return {
    slots: result,
    bench
  };
}

// Convert lineup to array suitable for FootballPitch
// Uses slot position (not player.pos) for correct rendering
function lineupToPitchSquad(lineup) {
  return lineup.slots.filter(s => s.player).map(s => ({
    ...s.player,
    _pitchPos: s.slot,
    pos: s.slot
  })); // override pos with slot
}

// Extract players by slot from lineup
function lineupBySlot(lineup, slot) {
  return lineup.slots.filter(s => s.slot === slot && s.player).map(s => s.player);
}

// Assign perks to EPL players by archetype/stats
function getPlayerPerk(p) {
  if (p.pos === "GK") return null;
  const arch = p.archetype;
  // Лидеры → Капитан
  if (arch === "leader") return "captain";
  // Перехватчики → Перехватчик
  if (arch === "interceptor") return "intercept";
  // Прорыв: MF с COM≥80 и TEC≥85 — проверяем ДО архетипа
  // Фоден, Де Брёйне, Бруну, Эдегор, Сака, Коул Палмер, Мэддисон
  if (p.pos === "MF" && p.com >= 80 && p.tec >= 85) return "breakthrough";
  // Снайперы дальних ударов → Снайпер дальних
  if (arch === "sniper" && p.com >= 85) return "longshot_ace";
  if (arch === "sniper") return "cold_blood";
  // Стены с мощным ударом
  if (arch === "wall" && p.phy >= 88) return "power_shot";
  if (arch === "wall" && p.phy >= 80) return "concrete";
  // Спринтеры
  if (arch === "sprinter" && p.pac >= 90) return "stamina";
  if (arch === "sprinter") return "cold_blood";
  // Метрономы
  if (arch === "metronome" && p.vis >= 90) return "eagle_eye";
  if (arch === "metronome") return "precise_pass";
  // Fallback по позиции
  if (p.pos === "FW" && p.com >= 80) return "cold_blood";
  if (p.pos === "FW") return "stamina";
  if (p.pos === "DF") return "concrete";
  return "stamina";
}

function computeSynergies(squad, coach) {
  const active = [];
  const isPhysruk = coach?.isPhysruk === true;
  for (const def of SYNDEF) {
    const _cu = coach?.unlocks || [];
    const cm = def.needsCoach === null || _cu.includes(def.id) || isPhysruk;
    let ids = [];
    if (def.type === "pair") {
      if (def.archs[1] === "any") {
        const a = squad.find(p => p.archetype === def.archs[0]);
        const others = squad.filter(p => a && p.id !== a.id);
        if (a && others.length > 0) ids = [a.id, ...others.map(p => p.id)];
      } else {
        const a = squad.find(p => p.archetype === def.archs[0]);
        const b = squad.find(p => p.archetype === def.archs[1]);
        if (a && b) ids = [a.id, b.id];
      }
    } else {
      const m = squad.filter(p => def.archs.includes(p.archetype));
      if (m.length >= (def.minCount || 2)) ids = m.map(p => p.id);
    }
    if (ids.length > 0) {
      const cb = cm ? isPhysruk && def.needsCoach !== null ? 0 : coach?.lvl || 0 : 0;
      // Физрук: синергия активна но со штрафом 50%
      const physrukPenalty = isPhysruk && def.needsCoach !== null;
      active.push({
        ...def,
        playerIds: ids,
        unlocked: cm,
        coachBonus: cb,
        physrukPenalty,
        effect: def.apply(squad.filter(p => ids.includes(p.id)), cb, physrukPenalty)
      });
    }
  }
  return active;
}
function applySyn(syn, player, phase) {
  let bonus = 0,
    labels = [],
    dr = false;
  for (const s of syn) {
    if (!s.unlocked || !s.playerIds.includes(player.id)) continue;
    const e = s.effect;
    if (e.type === "com_bonus" && e.target === player.archetype && phase === "shot") {
      bonus += e.val;
      labels.push(s.emoji + s.name + ":+" + e.val + "COM");
    }
    // Perfect pass: COM bonus in dribble (1FW vs DF) — see buildAttack for 2FW path
    if (e.type === "perfect_pass_bonus" && e.target === player.archetype && phase === "shot") {
      bonus += e.val;
      labels.push(s.emoji + s.name + ":+" + e.val + "COM к удару");
    }
    if (e.type === "pac_bonus" && e.target === player.archetype && phase === "dribble") {
      bonus += e.val;
      labels.push(s.emoji + s.name + ":+" + e.val + "PAC");
    }
    if (e.type === "double_roll" && e.target === player.archetype && phase === "shot") {
      if (!e.physruk || Math.random() < 0.5) {
        dr = true;
        labels.push(s.emoji + s.name + (e.physruk ? " (50%)" : ": x2"));
      }
    }
    if (e.type === "ovr_boost") {
      bonus += e.val;
      labels.push(s.emoji + s.name + ":+" + e.val);
    }
    if (e.type === "wall_double_roll" && player.archetype === "wall" && phase === "dribble") {
      dr = true;
      labels.push(s.emoji + s.name + ": x2");
    }
  }
  return {
    bonus,
    labels,
    doubleRoll: dr
  };
}
function getMidMult(syn) {
  for (const s of syn) {
    if (s.unlocked && s.effect.type === "mid_multiplier") return s.effect.val;
  }

}
function getPerfectPassBonus(syn) {
  for (const s of syn) {
    if (s.unlocked && s.effect.type === "perfect_pass_bonus") return s.effect.val;
  }
  return 0;
}
function hasPerfectPass(syn) {
  return syn.some(s => s.unlocked && s.effect.type === "perfect_pass_bonus");
}

}

        if (p) {
          sq.push({
            ...p,
            _slotPos: slot
          });
          used.add(p.id);

  }

    DF: [],
    GK: []
  };

    if (byPos[p.pos]) byPos[p.pos].push(p);
  });
  const slots = TACTIC_SLOTS[tactic] || TACTIC_SLOTS["1-2-1"];
  const used = new Set();
  const sq = [];
  for (const slot of slots) {

      const p = cands[Math.floor(Math.random() * Math.min(3, cands.length))];

function goalBeauty(event) {
  if (!event || !event.goal) return 0;
  let score = 10; // base
  const steps = event.steps || [];
  const types = steps.map(s => s.type);
  const minIdx = event.minIdx || 0; // 0-12, minute index

  // Дальний удар из центра (longshot)
  const isLongshot = steps.some(s => s.type === "duel" && s.data?.isLongshot);
  if (isLongshot) score += 30;

  // Штрафной
  if (types.includes("foul")) score += 25;

  // Дриблинг через 2+ защитников — считаем dribble wins в steps
  const dribbleWins = steps.filter(s => s.type === "duel" && s.data?.phase === "dribble" && s.data?.won).length;
  if (dribbleWins >= 2) score += 20;else if (dribbleWins === 1) score += 5;

  // Прорыв полузащитника (MF scoring)
  const mfGoal = steps.some(s => s.type === "duel" && s.data?.phase === "shot" && s.data?.won && s.data?.att?.pos === "MF");
  if (mfGoal) score += 28;

  // Идеальная передача (комбинация)
  const hasPerfectPass = types.includes("perfect_pass_cross");
  if (hasPerfectPass) score += 15;

  // Добивание после штанги
  if (types.includes("woodwork")) score += 22;

  // Гол в концовке (минута 9-12 = 65-89 мин)
  if (minIdx >= 9) score += 18;else if (minIdx >= 7) score += 8;

  // Прорыв через один перехват — тоже красиво
  const hasBreakthrough = steps.some(s => s.type === "info" && s.data?.label?.includes("ПРОРЫВ"));
  if (hasBreakthrough) score += 20;

  // Пенальти — не красиво
  if (types.includes("penalty")) score = Math.max(5, score - 20);

  // Вынос + гол (контратака)
  if (event.counterGoal) score += 12;

  // Синергия вспышка — свидетельство командной игры
  const synergySteps = steps.filter(s => s.type === "duel" && s.data?.synLabels?.length > 0).length;
  score += synergySteps * 5;

  // Normalize 0-100
  return Math.min(100, score);
}

// Picks best goal from match events by beauty score
function pickBestGoal(events) {
  if (!events || events.length === 0) return null;
  const goals = events.filter(ev => ev.goal && !ev.counterGoal);
  if (goals.length === 0) return null;
  let best = goals[0];
  let bestScore = goalBeauty(goals[0]);
  for (let i = 1; i < goals.length; i++) {
    const s = goalBeauty(goals[i]);
    if (s > bestScore) {
      bestScore = s;
      best = goals[i];
    }
  }
  return {
    event: best,
    beauty: bestScore
  };
}

      final: hF,
      roll: hR,
      ccb,
      tb,
      sb,
      synName: coverSyn?.name || null,
      synEmoji: coverSyn?.emoji || null,
      synColor: coverSyn?.color || null,
      synBonus: coverSyn ? Math.round(coverSyn.effect.val * 100) : 0
    },
    att: {
      name: att.name,
      pos: att.pos,
      arch: ARCH[att.archetype],
      final: aM,
      roll: aR
    },
    stopped,
    fatiguePct: stopped ? 0 : 0.15 + Math.random() * 0.10
  };
}
function resolvePass(fw, mf2, df2) {
  const pQ = Math.round(fw.vis * .5 + fw.tec * .5);
  const iQ = df2 ? Math.round(df2.vis * .6 + df2.pac * .4) : 0;
  const pR = rnd(pQ, 10),
    iR = df2 ? rnd(iQ, 10) : 0;
  return {
    passQuality: pQ,
    intercept: iQ,
    passRoll: pR,
    intRoll: iR,
    success: pR > iR,
    passer: fw.name,
    receiver: mf2?.name || "?",
    interceptor: df2?.name || null
  };
}
function resolveLongShot(fw, gk, syn) {
  const isSn = fw.archetype === "sniper";
  const base = Math.round(fw.com * .5 + fw.tec * .3 + fw.pac * .2);
  const sb = isSn ? 15 : 0;
  const synR = applySyn(syn, fw, "shot");
  const aF = base + sb + synR.bonus;
  const gkBase = Math.round(gk.phy * .78 + gk.vis * .18 + gk.com * .04);
  const aR = rnd(aF, 16),
    dR = rnd(gkBase, 20);
  const goal = aR > dR;
  const woodwork = !goal && Math.abs(aR - dR) <= 3;
  return {
    shotFinal: aF,
    gkBase,
    shotRoll: aR,
    gkRoll: dR,
    goal,
    woodwork,
    isSniper: isSn,
    sniperBonus: sb,
    synLabels: synR.labels
  };
}
function resolveFK(fw, gk) {
  const a = Math.round(fw.com * .7 + fw.tec * .3);
  const d = Math.round(gk.phy * .5 + gk.com * .5);
  const aR = rnd(a, 10), dR = rnd(d, 8);
  const goal = aR > dR;
  // Тип нарушения
  const foulTypes = [
    { type: "подкат", prob: 0.35, emoji: "🦵" },
    { type: "толчок", prob: 0.28, emoji: "👊" },
    { type: "задержка", prob: 0.22, emoji: "✋" },
    { type: "рука", prob: 0.15, emoji: "🤚" }
  ];
  let cum = 0, foulType = foulTypes[0];
  const r = Math.random();
  for (const ft of foulTypes) { cum += ft.prob; if (r < cum) { foulType = ft; break; } }
  // Тип удара
  const shotType = goal
    ? (Math.random() < 0.65 ? "прямой" : "навес")
    : (Math.random() < 0.55 ? "мимо" : "вратарь");
  return { shotRoll: aR, gkRoll: dR, goal, foulType, shotType };
}
function makeStats(sq, opp) {
  const st = {};
  [...sq, ...opp].forEach(p => {
    st[p.id] = {
      id: p.id,
      name: p.name,
      pos: p._slotPos || p.pos,
      shots: 0,
      goals: 0,
      saves: 0,
      tackles: 0,
      clearances: 0,
      assists: 0,
      duelsWon: 0,
      duels: 0,
      interceptions: 0,
      fatigue: 0
    };
  });
  return st;
}
// Fatigue rate by slot position
function fatRate(slotPos) {
  return slotPos === "FW" ? 0.09 : slotPos === "MF" ? 0.06 : 0.04;
}
// Get fatigue penalty for player (0=none, 0.2=20% penalty)
function getPlayerFat(ms, p, minIdx) {
  if (!ms || !ms[p.id]) return 0;
  const raw = ms[p.id].fatigue || 0;
  // S-кривая: медленно→быстро→плато (k=1.2, t0=6)
  const s = 1 / (1 + Math.exp(-1.2 * (minIdx - 6)));
  const fatPenalty = raw * s;
  // cold_blood: полностью убирает усталость
  const perk = p.perk;
  if (perk === "cold_blood") return 0;
  return Math.min(0.20, fatPenalty);
}
// Accumulate fatigue after each attack phase
function accumulateFat(ms, player, minIdx, isPhysruk = false) {
  if (!ms || !ms[player.id]) return;
  const rate = fatRate(player._slotPos || player.pos);
  const perk = player.perk;
  const accMult = perk === "stamina" ? 0.5 : 1;
  // Физрук: убирает усталость команды (накопление ×0.33)
  const physrukMult = isPhysruk ? 0.33 : 1;
  ms[player.id].fatigue = (ms[player.id].fatigue || 0) + rate * accMult * physrukMult;
}
function playerScore(s) {
  return s.goals * 10 + s.assists * 6 + s.saves * 7 + s.tackles * 4 + s.interceptions * 5 + s.duelsWon * 2;
}
function computeMVP(ms, mySq, oppSq) {
  const myIds = new Set(mySq.map(p => p.id));
  const oppIds = new Set(oppSq.map(p => p.id));
  let myMvp = null,
    myScore = -1,
    oppMvp = null,
    oppScore = -1;
  for (const [id, s] of Object.entries(ms)) {
    const sc = playerScore(s);
    if (myIds.has(Number(id)) && sc > myScore) {
      myScore = sc;
      myMvp = {
        ...s,
        score: sc,
        team: "my"
      };
    }
    if (oppIds.has(Number(id)) && sc > oppScore) {
      oppScore = sc;
      oppMvp = {
        ...s,
        score: sc,
        team: "opp"
      };
    }
  }
  const matchMvp = myScore >= oppScore ? myMvp : oppMvp;
  return {
    myMvp,
    oppMvp,
    matchMvp
  };
}

// ── ВЫНОС / КОНТРАТАКА ────────────────────────────────────────────────────────
// Вызывается когда защитник или вратарь выигрывает единоборство.
// clearerName — кто выбил, recvSquad — команда принимающая мяч,
// recvGk — вратарь команды которую атакуют
function resolveCounterAttack(clearer, recvSquad, recvGk, ms, atkFWCount = 1, defDFCount = 1) {
  const clearerName = clearer?.name || clearer; // accepts object or name string
  const clearerId = clearer?.id || null;
  // Use _slotPos (schema position) not original player pos
  const recvFWs = recvSquad.filter(p => (p._slotPos || p.pos) === "FW");
  const fw = recvFWs.length > 0 ? pick(recvFWs) : recvSquad.find(p => (p._slotPos || p.pos) !== "GK") || recvSquad[0];
  if (!fw) return null;

  // а) Принял мяч? FW(controlBase, 20) vs DF_pressure(73 - numAdv*8, 20)
  const controlBase = Math.round(fw.tec * 0.60 + fw.vis * 0.40);
  const numAdvantage = atkFWCount - defDFCount; // +1=легче, -1=тяжелее
  const dfPressure = 73 - numAdvantage * 8; // 65(2v1) / 73(1v1) / 81(1v2)
  const dfPressureRoll = rnd(dfPressure, 20);
  // 2v2: берём лучший из двух касаний (выбор кому отдать)
  const is2v2 = atkFWCount >= 2 && defDFCount >= 2;
  const controlRoll = is2v2
    ? Math.max(rnd(controlBase, 20), rnd(controlBase, 20))
    : rnd(controlBase, 20);
  const received = controlRoll > dfPressureRoll;
  const numAdvLabel = numAdvantage > 0 ? `${atkFWCount}v${defDFCount} — численное преимущество` : numAdvantage < 0 ? `${atkFWCount}v${defDFCount} — прессинг защитников` : `${atkFWCount}v${defDFCount} — равно`;
  const controlThreshold = dfPressure; // kept for UI display
  if (ms && ms[fw.id]) ms[fw.id].duels++;
  if (!received) {
    return {
      type: "counter",
      fw: {
        name: fw.name,
        pos: fw.pos,
        arch: ARCH[fw.archetype],
        tec: fw.tec,
        vis: fw.vis,
        controlBase,
        controlRoll
      },
      received: false,
      label: "🦵 ВЫНОС ВПЕРЁД"
    };
  }

  // б) Принял → прямой удар по воротам (FW vs GK)
  const shotBase = Math.round(fw.com * 0.52 + fw.tec * 0.33 + fw.vis * 0.15);
  const archBonus = AB.shot?.att[fw.archetype] || 0;
  const shotFinal = shotBase + archBonus;
  const gkBase = Math.round(recvGk.phy * 0.78 + recvGk.vis * 0.18 + recvGk.com * 0.04);
  const shotRoll = rnd(shotFinal, 24);
  const gkRoll = rnd(gkBase, 22);
  const goal = shotRoll > gkRoll;
  if (ms && ms[fw.id]) ms[fw.id].shots++;
  if (ms && ms[recvGk.id]) {
    if (!goal) ms[recvGk.id].saves++;
  }
  if (goal && ms && ms[fw.id]) ms[fw.id].goals++;
  // Ассист тому кто выбил мяч (защитник или вратарь)
  if (goal && clearerId && ms && ms[clearerId]) ms[clearerId].assists++;
  return {
    type: "counter",
    fw: {
      name: fw.name,
      pos: fw.pos,
      arch: ARCH[fw.archetype],
      tec: fw.tec,
      vis: fw.vis,
      controlBase,
      controlRoll,
      controlThreshold
    },
    gk: {
      name: recvGk.name,
      pos: recvGk.pos,
      arch: ARCH[recvGk.archetype],
      base: gkBase
    },
    received: true,
    clearerName,
    numAdvLabel,
    shotFinal,
    shotRoll,
    gkRoll,
    goal,
    label: "🦵 ВЫНОС ВПЕРЁД"
  };
}

// buildAttack now receives pre-built lineups instead of raw squads
// atkLU = buildLineup(activeSquad, tactic) — already assigned slots
// defLU = buildLineup(defSquad, defTactic)
function buildAttack(atkLU, defLU, aC, dC, aT, dT, aSyn, dSyn, ms) {
  const tac = TACTICS[aT] || TACTICS["1-2-1"];
  const dtac = TACTICS[dT] || TACTICS["1-2-1"];
  // Pull players from lineup slots — only players on the pitch
  const aFWs = lineupBySlot(atkLU, "FW");
  const aMFs = lineupBySlot(atkLU, "MF");
  const dMFs = lineupBySlot(defLU, "MF");
  const dDFs = lineupBySlot(defLU, "DF");
  const gk = lineupBySlot(defLU, "GK")[0] || defLU.slots[defLU.slots.length - 1]?.player;
  // Pick from correct slots (already OOP-penalised if needed)
  // Чередование FW: при 2 форвардах берём менее задействованного
  const fw = aFWs.length >= 2 && ms
    ? aFWs.reduce((a, b) => {
        const sa = ms[a?.id]?.shots || 0;
        const sb = ms[b?.id]?.shots || 0;
        return sa <= sb ? a : b;
      })
    : (pick(aFWs) || pick(aMFs) || atkLU.slots[0]?.player);
  const mf = pick(aMFs) || pick(aFWs) || atkLU.slots[0]?.player;
  if (!fw || !mf) return { steps: [], goal: false };
  const dMf = pick(dMFs) || pick(dDFs) || defLU.slots[0]?.player;
  const dDf = pick(dDFs) || defLU.slots[0]?.player;
  // Second players for cover/pass
  const aMF2 = aMFs.filter(p => p?.id !== mf?.id)[0] || null;
  const dDF2 = dDFs.filter(p => p?.id !== dDf?.id)[0] || null;
  const mf2 = aMF2;
  // Safety: bail if critical players missing
  if (!fw || !mf || !dMf || !dDf || !gk) return {
    steps: [{
      type: "end",
      data: {
        label: "❌ Не хватает игроков",
        note: "Проверь состав"
      }
    }],
    goal: false
  };
  const steps = [];
  const isPhysruk = aC?.isPhysruk || false;
  // Инициализируем усталость форварда из накопленной статистики матча
  const minIdx = ms ? Object.values(ms).reduce((mx, s) => Math.max(mx, (s.shots||0)+(s.tackles||0)), 0) : 0;
  if (!fw || !gk) return { steps: [], goal: false };
  let fat = getPlayerFat(ms, fw, Math.min(minIdx, 12));
  const mm = getMidMult(aSyn);
  const td = (a, d, w) => {
    if (ms) {
      if (ms[a]) {
        ms[a].duels++;
        if (w) ms[a].duelsWon++;
      }
      if (ms[d]) {
        ms[d].duels++;
        if (!w) ms[d].duelsWon++;
      }
    }
  };
  // Phase 1
  const d1 = resolveDuel(mf, dMf, "midfield", aC, 0, aSyn, 0, dSyn);
  td(mf.id, dMf.id, d1.won);
  steps.push({
    type: "duel",
    data: d1
  });
  if (!d1.won) {
    if (ms && ms[dMf.id]) ms[dMf.id].tackles++;
    // Читающий центр: перехват до cover и выноса
    if (dSyn.some(s => s.unlocked && s.effect.type === "reading_center" && (!s.effect.physruk || Math.random() < 0.5))) {
      steps.push({ type: "info", data: { label: "🎵🛡 ЧИТАЮЩИЙ ЦЕНТР! Перехват", note: "Метроном читает вынос — мяч возвращён!", synergy: true } });
      steps.push({ type: "end", data: { label: "❌ АТАКА ОСТАНОВЛЕНА", note: "Читающий центр прервал атаку" } });
      return { steps, goal: false, readingCounterAttack: true };
    }
    const mc = tac.coverChance + (aC?.coverBonus || 0);
    if (aMF2 && aMFs.length >= 2 && Math.random() < mc) {
      const cv = resolveCover(aMF2, dMf, "midfield", aC, aT, aSyn);
      steps.push({
        type: "cover",
        data: {
          ...cv,
          isDefending: false
        }
      });
      if (cv.stopped) {
        steps.push({
          type: "end",
          data: {
            label: "❌ АТАКА ПРОВАЛЕНА",
            note: "Центр не пройден"
          }
        });
        return {
          steps,
          goal: false
        };
      }
      steps.push({
        type: "info",
        data: {
          label: "🔄 МЯЧ ВОЗВРАЩЁН",
          note: "Атака продолжается"
        }
      });
    } else {
      steps.push({
        type: "end",
        data: {
          label: "❌ АТАКА ПРОВАЛЕНА",
          note: "Центр не пройден"
        }
      });
      return {
        steps,
        goal: false
      };
    }
  }
  const rawMB = d1.won ? tac.midBonus + (aC?.spec === "tactical" ? 20 : 0) + 10 : tac.midBonus + 5;
  const midBonus = Math.round(rawMB * mm);
  const mfAssistId = d1.won ? mf.id : null; // MF gets assist if attack ends in goal
  // Breakthrough perk: MF прорывается сам — пропускает фазу DF
  if (d1.won && mf.perk === "breakthrough" && mf.com >= 70 && Math.random() < 0.22) {
    steps.push({
      type: "info",
      data: {
        label: "💥 ПРОРЫВ ПОЛУЗАЩИТНИКА",
        note: `${mf.name} врывается в штрафную — пропускает защитника!`
      }
    });
    const btShot = resolveDuel(mf, gk, "shot", aC, midBonus, aSyn, 0, dSyn);
    td(mf.id, gk.id, btShot.won);
    if (ms) {
      ms[mf.id].shots++;
      if (btShot.won) {
        ms[mf.id].goals++;
      } else {
        ms[gk.id].saves++;
      }
    }
    steps.push({
      type: "duel",
      data: {
        ...btShot,
        label: "💥 МФ ЗАВЕРШАЕТ САМ",
        att: {
          ...btShot.att,
          ...mf,
          pos: "MF",
          name: mf.name
        },
        phase: "shot"
      }
    });
    return {
      steps,
      goal: btShot.won
    };
  }
  // Long shot from midfield
  if (d1.won && mf.com >= 65 && Math.random() < 0.12) {
    const ls = resolveLongShot(mf, gk, aSyn);
    if (ms && ms[mf.id]) ms[mf.id].shots++;
    if (ls.goal && ms && ms[mf.id]) ms[mf.id].goals++;
    if (!ls.goal && ms && ms[gk.id]) ms[gk.id].saves++;
    steps.push({
      type: "longshot",
      data: {
        label: "💫 ДАЛЬНИЙ УДАР ИЗ ЦЕНТРА",
        note: `${mf.name} бьёт из полузащиты`,
        ...ls
      }
    });
    return {
      steps,
      goal: ls.goal
    };
  }
  // Темп: после выигранного центра FW пропускает защитника
  const tempoSyn = aSyn.find(s => s.unlocked && s.effect.type === "tempo_skip" && s.playerIds.includes(fw?.id) && (!s.effect.physruk || Math.random() < 0.5));
  if (d1.won && tempoSyn) {
    // Защитник пытается догнать: шанс = clamp((df.pac - fw.pac + 10) / 30, 0, 0.5)
    // Быстрый DF (pac≥fw.pac) даёт до 50% шанс догнать, медленный — 0%
    const dfPac = dDf?.pac || 70;
    const fwPac = fw?.pac || 80;
    // Catch: зависит от PHY защитника, не PAC форварда
    const catchChance = Math.max(0.05, Math.min(0.40, ((dDf?.phy || 75) - 60) / 120));
    const dfCaught = catchChance > 0 && Math.random() < catchChance;
    steps.push({
      type: "info",
      data: {
        label: dfCaught ? `⚡ Темп! Но ${dDf?.name || "защитник"} догнал (PHY ${dDf?.phy || "?"})` : "🎵⚡ ТЕМП! Обход защитника",
        note: dfCaught ? `${dDf?.name || "Защитник"} физически настиг — шанс был ${Math.round(((dDf?.phy||75)-60)/120*100)}%` : `${fw.name} врывается напрямую к воротам!`,
        synergy: true
      }
    });
    if (dfCaught && dDf) {
      // DF догнал — обычный дриблинг
      const d2catch = resolveDuel(fw, dDf, "dribble", aC, midBonus, aSyn, fat, dSyn);
      steps.push({ type: "duel", data: d2catch });
      if (!d2catch.won) {
        return { steps, goal: false };
      }
    }
    const tShot = resolveDuel(fw, gk, "shot", aC, midBonus, aSyn, fat, dSyn);
    td(fw.id, gk.id, tShot.won);
    if (ms) {
      ms[fw.id].shots++;
      if (tShot.won) {
        ms[fw.id].goals++;
      } else {
        ms[gk.id].saves++;
      }
    }
    if (mfAssistId && tShot.won && ms && ms[mfAssistId]) ms[mfAssistId].assists++;
    steps.push({
      type: "duel",
      data: {
        ...tShot,
        label: "🔥 УДАР ПО ВОРОТАМ",
        att: {
          ...tShot.att,
          ...fw,
          pos: fw.pos
        },
        phase: "shot"
      }
    });
    return {
      steps,
      goal: tShot.won
    };
  }

  // Phase 2
  const d2 = resolveDuel(fw, dDf, "dribble", aC, midBonus, aSyn, fat, dSyn);
  td(fw.id, dDf.id, d2.won);
  const d2s = {
    type: "duel",
    data: d2
  };
  if (mm > 1 && d1.won) d2s.midMultNote = `🎵 Тики-така x${mm}`;
  steps.push(d2s);
  if (!d2.won) {
    if (ms && ms[dDf.id]) {
      ms[dDf.id].tackles++;
      ms[dDf.id].clearances++;
    }
    // ── ШТРАФНОЙ — защитник фолит при PAC gap ≥10 (28%) ──────────────────────
    if (fw.pac - dDf.pac >= 10 && Math.random() < 0.28) {
      const fk = resolveFK(fw, gk);
      if (ms && ms[fw.id]) ms[fw.id].shots++;
      if (fk.goal && ms && ms[fw.id]) ms[fw.id].goals++;
      if (!fk.goal && ms && ms[gk.id]) ms[gk.id].saves++;
      steps.push({ type: "foul", data: { label: "🟨 ФОЛ! ШТРАФНОЙ", note: `${dDf?.name || "Защитник"} фолит на ${fw?.name || "Форвард"}`, shooter: fw?.name, pacGap: fw?.pac - (dDf?.pac || 70), shotRoll: fk.shotRoll, gkRoll: fk.gkRoll, goal: fk.goal, foulType: fk.foulType, shotType: fk.shotType } });
      return { steps, goal: fk.goal };
    }
    // Вынос вперёд — базовый 35% или sharp_counter синергия
    const sharpCtr = dSyn.find(s => s.unlocked && s.effect.type === "sharp_counter");
    const counterChance = sharpCtr ? sharpCtr.effect.chance : 0.35;
    if (Math.random() < counterChance) {
      // For counter: extract flat player arrays from lineups
      const atkFlat = atkLU.slots.map(s => s.player).filter(Boolean);
      const defFlat = defLU.slots.map(s => s.player).filter(Boolean);
      const myGk = lineupBySlot(atkLU, "GK")[0] || atkFlat[atkFlat.length - 1];
      const ctr = resolveCounterAttack(dDf, defFlat, myGk, ms, dDFs.length, aFWs.length);
      if (ctr) {
        steps.push({
          type: "counter",
          data: ctr
        });
        return {
          steps,
          goal: false,
          counterGoal: ctr.goal ?? false
        };
      }
    }
    steps.push({
      type: "info",
      data: {
        label: "🦵 ВЫНОС В ЦЕНТР",
        note: `${dDf.name} выбил в центр поля`
      }
    });
    return {
      steps,
      goal: false
    };
  }
  // ── ПЕНАЛЬТИ — форвард вошёл в штрафную, защитник фолит (4%) ────────────────
  if (d2.won && Math.random() < 0.038) {
    const penBase = Math.round(fw.com * 0.75 + fw.tec * 0.25);
    const penRoll = rnd(penBase, 10);
    const gkPenBase = Math.round(gk.phy * 0.45 + gk.vis * 0.45 + gk.com * 0.10);
    const gkPenRoll = rnd(gkPenBase, 14);
    const penGoal = penRoll > gkPenRoll;
    if (ms && ms[fw.id]) ms[fw.id].shots++;

    steps.push({
      type: "perfect_pass_cross",

      }

      const gkIntBase = Math.round(gk.vis * 0.55 + gk.pac * 0.45);

      steps[d3idx] = {
        ...steps[d3idx],
        data: {
          ...steps[d3idx].data,

      };
    }
    steps.push({
      type: "woodwork",
      data: {
        isPost,
        fw: {
          name: fw.name,
          pos: fw.pos,
          arch: ARCH[fw.archetype]
        },
        gk: {
          name: gk.name,

        },
        rebound: {
          base: rebBase,
          roll: rebRoll,
          gkRoll: gkRebRoll,

        }
      }
    });

      steps,
      goal: rebGoal

  }

  // Normal shot result
  if (ms) {
    if (d3.won && ms[fw.id]) ms[fw.id].goals++;
    if (!d3.won && gk && ms[gk.id]) ms[gk.id].saves++;
    if (d3.won && mfAssistId && ms[mfAssistId] && mfAssistId !== fw.id) ms[mfAssistId].assists++;
  }

  // Вратарь поймал → вынос (sharp_counter: 35% базово, с синергией выше)
  const sharpCtrGk = dSyn.find(s => s.unlocked && s.effect.type === "sharp_counter");
  const gkCtrChance = sharpCtrGk ? sharpCtrGk.effect.chance : 0.25;
  if (!d3.won && Math.random() < gkCtrChance) {
    const atkFlat = atkLU.slots.map(s => s.player).filter(Boolean);
    const defFlat = defLU.slots.map(s => s.player).filter(Boolean);
    const myGk = lineupBySlot(atkLU, "GK")[0] || atkFlat[atkFlat.length - 1];
    const ctr = resolveCounterAttack(gk, defFlat, myGk, ms, dDFs.length, aFWs.length);
    if (ctr) {

        type: "counter",
        data: ctr
      });
      return {
        steps,
        goal: d3.won,
        counterGoal: ctr.goal ?? false
      };
    }
  }
  return {
    steps,
    goal: d3.won
  };

// Auto-select best 5 matching tactic slots: best per position
function autoSelectSquad(squad, tactic = "1-2-1") {
  if (!squad || squad.length === 0) return [];
  const slots = TACTIC_SLOTS[tactic] || TACTIC_SLOTS["1-2-1"];
  // Count needed per position
  const needed = {
    GK: 0,
    DF: 0,
    MF: 0,
    FW: 0
  };
  slots.forEach(s => needed[s] = (needed[s] || 0) + 1);
  // Sort each position by OVR desc
  const byPos = {};
  ["GK", "DF", "MF", "FW"].forEach(pos => {
    byPos[pos] = squad.filter(p => p.pos === pos).sort((a, b) => ovr(b) - ovr(a));
  });
  const result = [];
  const used = new Set();
  // Fill each slot with best available player of that position
  ["GK", "DF", "MF", "FW"].forEach(pos => {
    const count = needed[pos] || 0;
    const pool = byPos[pos];
    let filled = 0;
    for (const p of pool) {
      if (filled >= count) break;
      if (!used.has(p.id)) {
        result.push(p);
        used.add(p.id);
        filled++;
      }
    }
  });
  // If still < 5, fill with highest OVR remaining (OOP)
  if (result.length < 5) {
    const remaining = squad.filter(p => !used.has(p.id)).sort((a, b) => ovr(b) - ovr(a));
    for (const p of remaining) {
      if (result.length >= 5) break;
      result.push(p);
    }
  }
  return result;
}
