const TACTIC_SLOTS = {
  "2-1-1": ["FW", "FW", "MF", "DF", "GK"],
  "1-2-1": ["FW", "MF", "MF", "DF", "GK"],
  "1-1-2": ["FW", "MF", "DF", "DF", "GK"]
};
function ovr(p) {
  return Math.round((p.pac + p.phy + p.tec + p.vis + p.com) / 5);
}

// Build a lineup from squad + tactic.
// Returns {slots:[{player,slot,oop},...], bench:[...]}
// Players are assigned greedily: correct pos first, then OOP with penalty.
function buildLineup(squad, tactic) {
  const slots = TACTIC_SLOTS[tactic] || TACTIC_SLOTS["1-2-1"];
  const used = new Set();
  const result = [];

  // Pass 1: fill each slot with correct-position player
  const remaining = () => squad.filter(p => !used.has(p.id));
  for (const slot of slots) {
    const candidates = remaining().filter(p => p.pos === slot);
    if (candidates.length > 0) {
      const p = pick(candidates);
      used.add(p.id);
      result.push({
        player: {
          ...p,
          _slotPos: slot
        },
        slot,
        oop: false
      });
    } else {
      result.push({
        player: null,
        slot,
        oop: true
      }); // fill later
    }
  }

  // Pass 2: fill empty slots with OOP players
  for (let i = 0; i < result.length; i++) {
    if (!result[i].player) {
      const slot = result[i].slot;
      // Get all unused players; prefer non-GK for field slots
      const avail = squad.filter(p => !used.has(p.id));
      const preferred = slot === "GK" ? avail // for GK slot take anyone
      : avail.filter(p => p.pos !== "GK"); // for field slots avoid GK
      const p = pick(preferred.length > 0 ? preferred : avail);
      if (p) {
        used.add(p.id);
        const isOOP = p.pos !== slot; // только если позиция НЕ совпадает со слотом
        result[i].player = isOOP ? {
          ...p,
          pac: Math.round(p.pac * 0.85),
          phy: Math.round(p.phy * 0.85),
          tec: Math.round(p.tec * 0.85),
          vis: Math.round(p.vis * 0.85),
          com: Math.round(p.com * 0.85),
          _oop: true,
          _oopPos: slot,
          _slotPos: slot
        } : {
          ...p,
          _oop: false,
          _slotPos: slot // правильная позиция — без штрафа
        };
      }
    }
  }
  const bench = squad.filter(p => !used.has(p.id));
  return {
    slots: result,
    bench
  };
}

// Convert lineup to array suitable for FootballPitch
// Uses slot position (not player.pos) for correct rendering
function lineupToPitchSquad(lineup) {
  return lineup.slots.filter(s => s.player).map(s => ({
    ...s.player,
    _pitchPos: s.slot,
    pos: s.slot
  })); // override pos with slot
}

// Extract players by slot from lineup
function lineupBySlot(lineup, slot) {
  return lineup.slots.filter(s => s.slot === slot && s.player).map(s => s.player);
}

// Assign perks to EPL players by archetype/stats
function getPlayerPerk(p) {
  if (p.pos === "GK") return null;
  const arch = p.archetype;
  // Лидеры → Капитан
  if (arch === "leader") return "captain";
  // Перехватчики → Перехватчик
  if (arch === "interceptor") return "intercept";
  // Прорыв: MF с COM≥80 и TEC≥85 — проверяем ДО архетипа
  // Фоден, Де Брёйне, Бруну, Эдегор, Сака, Коул Палмер, Мэддисон
  if (p.pos === "MF" && p.com >= 80 && p.tec >= 85) return "breakthrough";
  // Снайперы дальних ударов → Снайпер дальних
  if (arch === "sniper" && p.com >= 85) return "longshot_ace";
  if (arch === "sniper") return "cold_blood";
  // Стены с мощным ударом
  if (arch === "wall" && p.phy >= 88) return "power_shot";
  if (arch === "wall" && p.phy >= 80) return "concrete";
  // Спринтеры
  if (arch === "sprinter" && p.pac >= 90) return "stamina";
  if (arch === "sprinter") return "cold_blood";
  // Метрономы
  if (arch === "metronome" && p.vis >= 90) return "eagle_eye";
  if (arch === "metronome") return "precise_pass";
  // Fallback по позиции
  if (p.pos === "FW" && p.com >= 80) return "cold_blood";
  if (p.pos === "FW") return "stamina";
  if (p.pos === "DF") return "concrete";
  return "stamina";
}

function computeSynergies(squad, coach) {
  const active = [];
  const isPhysruk = coach?.isPhysruk === true;
  for (const def of SYNDEF) {
    const cm = def.needsCoach === null || coach?.spec === def.needsCoach || isPhysruk;
    let ids = [];
    if (def.type === "pair") {
      if (def.archs[1] === "any") {
        const a = squad.find(p => p.archetype === def.archs[0]);
        const b = squad.find(p => a && p.id !== a.id);
        if (a && b) ids = [a.id, b.id];
      } else {
        const a = squad.find(p => p.archetype === def.archs[0]);
        const b = squad.find(p => p.archetype === def.archs[1]);
        if (a && b) ids = [a.id, b.id];
      }
    } else {
      const m = squad.filter(p => def.archs.includes(p.archetype));
      if (m.length >= (def.minCount || 2)) ids = m.map(p => p.id);
    }
    if (ids.length > 0) {
      const cb = cm ? isPhysruk && def.needsCoach !== null ? 0 : coach?.lvl || 0 : 0;
      // Физрук: синергия активна но со штрафом 50%
      const physrukPenalty = isPhysruk && def.needsCoach !== null;
      active.push({
        ...def,
        playerIds: ids,
        unlocked: cm,
        coachBonus: cb,
        physrukPenalty,
        effect: def.apply(squad.filter(p => ids.includes(p.id)), cb, physrukPenalty)
      });
    }
  }
  return active;
}
function applySyn(syn, player, phase) {
  let bonus = 0,
    labels = [],
    dr = false;
  for (const s of syn) {
    if (!s.unlocked || !s.playerIds.includes(player.id)) continue;
    const e = s.effect;
    if (e.type === "com_bonus" && e.target === player.archetype && phase === "shot") {
      bonus += e.val;
      labels.push(s.emoji + s.name + ":+" + e.val + "COM");
    }
    // Perfect pass: COM bonus in dribble (1FW vs DF) — see buildAttack for 2FW path
    if (e.type === "perfect_pass_bonus" && e.target === player.archetype && phase === "dribble") {
      bonus += e.val;
      labels.push(s.emoji + s.name + ":+" + e.val + "COM к удару");
    }
    if (e.type === "pac_bonus" && e.target === player.archetype && phase === "dribble") {
      bonus += e.val;
      labels.push(s.emoji + s.name + ":+" + e.val + "PAC");
    }
    if (e.type === "double_roll" && e.target === player.archetype && phase === "shot") {
      if (!e.physruk || Math.random() < 0.5) {
        dr = true;
        labels.push(s.emoji + s.name + (e.physruk ? " (50%)" : ": x2"));
      }
    }
    if (e.type === "ovr_boost") {
      bonus += e.val;
      labels.push(s.emoji + s.name + ":+" + e.val);
    }
  }
  return {
    bonus,
    labels,
    doubleRoll: dr
  };
}
function getMidMult(syn) {
  for (const s of syn) {
    if (s.unlocked && s.effect.type === "mid_multiplier") return s.effect.val;
  }
  return 1;
}
function getPerfectPassBonus(syn) {
  for (const s of syn) {
    if (s.unlocked && s.effect.type === "perfect_pass_bonus") return s.effect.val;
  }
  return 0;
}
function hasPerfectPass(syn) {
  return syn.some(s => s.unlocked && s.effect.type === "perfect_pass_bonus");
}
function getCoverBonus(syn) {
  let b = 0;
  for (const s of syn) {
    if (s.unlocked && s.effect.type === "cover_bonus") b += s.effect.val;
  }
  return b;
}

function buildSeasonSquad(seasonEntry) {
  // Use pre-built real squad if available
  if (seasonEntry && seasonEntry.squad && seasonEntry.squad.length > 0) {
    const slots = TACTIC_SLOTS[seasonEntry.tactic] || TACTIC_SLOTS["1-2-1"];
    const byPos = {
      FW: [],
      MF: [],
      DF: [],
      GK: []
    };
    seasonEntry.squad.forEach(p => {
      if (byPos[p.pos]) byPos[p.pos].push(p);
    });
    const used = new Set();
    const sq = [];
    for (const slot of slots) {
      const cands = byPos[slot].filter(p => !used.has(p.id));
      if (cands.length) {
        sq.push({
          ...cands[0],
          _slotPos: slot
        });
        used.add(cands[0].id);
      }
    }
    // Fill missing slots from ALL_PLAYERS if needed
    if (sq.length < slots.length) {
      const diff = seasonEntry.difficulty || 1;
      const pool = [...ALL_PLAYERS].sort((a, b) => ovr(b) - ovr(a)).filter(p => diff <= 2 ? ovr(p) <= 76 : diff <= 3 ? ovr(p) <= 83 : diff <= 4 ? ovr(p) <= 89 : true);
      for (let i = sq.length; i < slots.length; i++) {
        const slot = slots[i];
        const p = pool.find(x => x.pos === slot && !used.has(x.id));
        if (p) {
          sq.push({
            ...p,
            _slotPos: slot
          });
          used.add(p.id);
        }
      }
    }
    return sq;
  }
  // Fallback: random from ALL_PLAYERS by difficulty
  const diff = seasonEntry ? seasonEntry.difficulty : 1;
  const tactic = seasonEntry ? seasonEntry.tactic : "1-2-1";
  const rated = [...ALL_PLAYERS].sort((a, b) => ovr(b) - ovr(a));
  const pool = diff <= 2 ? rated.filter(p => ovr(p) <= 76) : diff <= 3 ? rated.filter(p => ovr(p) <= 83) : diff <= 4 ? rated.filter(p => ovr(p) <= 89) : rated;
  const byPos = {
    FW: [],
    MF: [],
    DF: [],
    GK: []
  };
  pool.forEach(p => {
    if (byPos[p.pos]) byPos[p.pos].push(p);
  });
  const slots = TACTIC_SLOTS[tactic] || TACTIC_SLOTS["1-2-1"];
  const used = new Set();
  const sq = [];
  for (const slot of slots) {
    const cands = byPos[slot].filter(p => !used.has(p.id));
    if (cands.length) {
      const p = cands[Math.floor(Math.random() * Math.min(3, cands.length))];
      used.add(p.id);
      sq.push({
        ...p,
        _slotPos: slot
      });
    }
  }
  return sq;
}

function goalBeauty(event) {
  if (!event || !event.goal) return 0;
  let score = 10; // base
  const steps = event.steps || [];
  const types = steps.map(s => s.type);
  const minIdx = event.minIdx || 0; // 0-12, minute index

  // Дальний удар из центра (longshot)
  const isLongshot = steps.some(s => s.type === "duel" && s.data?.isLongshot);
  if (isLongshot) score += 30;

  // Штрафной
  if (types.includes("foul")) score += 25;

  // Дриблинг через 2+ защитников — считаем dribble wins в steps
  const dribbleWins = steps.filter(s => s.type === "duel" && s.data?.phase === "dribble" && s.data?.won).length;
  if (dribbleWins >= 2) score += 20;else if (dribbleWins === 1) score += 5;

  // Прорыв полузащитника (MF scoring)
  const mfGoal = steps.some(s => s.type === "duel" && s.data?.phase === "shot" && s.data?.won && s.data?.att?.pos === "MF");
  if (mfGoal) score += 28;

  // Идеальная передача (комбинация)
  const hasPerfectPass = types.includes("perfect_pass_cross");
  if (hasPerfectPass) score += 15;

  // Добивание после штанги
  if (types.includes("woodwork")) score += 22;

  // Гол в концовке (минута 9-12 = 65-89 мин)
  if (minIdx >= 9) score += 18;else if (minIdx >= 7) score += 8;

  // Прорыв через один перехват — тоже красиво
  const hasBreakthrough = steps.some(s => s.type === "info" && s.data?.label?.includes("ПРОРЫВ"));
  if (hasBreakthrough) score += 20;

  // Пенальти — не красиво
  if (types.includes("penalty")) score = Math.max(5, score - 20);

  // Вынос + гол (контратака)
  if (event.counterGoal) score += 12;

  // Синергия вспышка — свидетельство командной игры
  const synergySteps = steps.filter(s => s.type === "duel" && s.data?.synLabels?.length > 0).length;
  score += synergySteps * 5;

  // Normalize 0-100
  return Math.min(100, score);
}

// Picks best goal from match events by beauty score
function pickBestGoal(events) {
  if (!events || events.length === 0) return null;
  const goals = events.filter(ev => ev.goal && !ev.counterGoal);
  if (goals.length === 0) return null;
  let best = goals[0];
  let bestScore = goalBeauty(goals[0]);
  for (let i = 1; i < goals.length; i++) {
    const s = goalBeauty(goals[i]);
    if (s > bestScore) {
      bestScore = s;
      best = goals[i];
    }
  }
  return {
    event: best,
    beauty: bestScore
  };
}

function effCover(base, fw, df2, tactic, steelWill = false) {

function resolveCover(helper, att, phase, coach, tactic, syn) {

function makeStats(sq, opp) {
  const st = {};
  [...sq, ...opp].forEach(p => {

      id: p.id,
      name: p.name,
      pos: p._slotPos || p.pos,

      saves: 0,

// Fatigue rate by slot position
function fatRate(slotPos) {
  return slotPos === "FW" ? 0.09 : slotPos === "MF" ? 0.06 : 0.04;
}
// Get fatigue penalty for player (0=none, 0.2=20% penalty)
function getPlayerFat(ms, p, minIdx) {
  if (!ms || !ms[p.id]) return 0;
  const raw = ms[p.id].fatigue || 0;
  // Накопительная по матчу: после 7й минуты (idx3) начинается
  const matchPct = Math.max(0, (minIdx - 3) / 10); // 0 → 1 по ходу матча
  const fatPenalty = raw * matchPct;
  // Пerk: cold_blood снижает на 50%, stamina снижает накопление
  const perk = p.perk;
  const mult = perk === "cold_blood" ? 0.5 : 1;
  return Math.min(0.25, fatPenalty * mult);
}
// Accumulate fatigue after each attack phase
function accumulateFat(ms, player, minIdx) {
  if (!ms || !ms[player.id]) return;
  const rate = fatRate(player._slotPos || player.pos);
  const perk = player.perk;
  const accMult = perk === "stamina" ? 0.7 : 1;
  ms[player.id].fatigue = (ms[player.id].fatigue || 0) + rate * accMult;
}
function playerScore(s) {
  return s.goals * 10 + s.assists * 6 + s.saves * 7 + s.tackles * 4 + s.interceptions * 5 + s.duelsWon * 2;
}
function computeMVP(ms, mySq, oppSq) {
  const myIds = new Set(mySq.map(p => p.id));
  const oppIds = new Set(oppSq.map(p => p.id));
  let myMvp = null,
    myScore = -1,
    oppMvp = null,
    oppScore = -1;
  for (const [id, s] of Object.entries(ms)) {
    const sc = playerScore(s);
    if (myIds.has(Number(id)) && sc > myScore) {
      myScore = sc;
      myMvp = {
        ...s,
        score: sc,
        team: "my"
      };
    }
    if (oppIds.has(Number(id)) && sc > oppScore) {
      oppScore = sc;
      oppMvp = {
        ...s,
        score: sc,
        team: "opp"
      };
    }
  }
  const matchMvp = myScore >= oppScore ? myMvp : oppMvp;

    myMvp,
    oppMvp,
    matchMvp

// ── ВЫНОС / КОНТРАТАКА ────────────────────────────────────────────────────────
// Вызывается когда защитник или вратарь выигрывает единоборство.
// clearerName — кто выбил, recvSquad — команда принимающая мяч,
// recvGk — вратарь команды которую атакуют
function resolveCounterAttack(clearer, recvSquad, recvGk, ms, atkFWCount = 1, defDFCount = 1) {
  const clearerName = clearer?.name || clearer; // accepts object or name string
  const clearerId = clearer?.id || null;
  // Use _slotPos (schema position) not original player pos
  const recvFWs = recvSquad.filter(p => (p._slotPos || p.pos) === "FW");
  const fw = recvFWs.length > 0 ? pick(recvFWs) : recvSquad.find(p => (p._slotPos || p.pos) !== "GK") || recvSquad[0];
  if (!fw) return null;

  // а) Принял мяч? TEC + VIS — контроль первого касания
  const controlBase = Math.round(fw.tec * 0.60 + fw.vis * 0.40);
  const controlRoll = rnd(controlBase, 20);
  // Численное преимущество в линии атаки vs защиты при выносе
  // Больше FW чем DF → проще принять (порог ниже)
  // Меньше FW чем DF → сложнее (порог выше)
  const numAdvantage = atkFWCount - defDFCount; // +1=легче, -1=тяжелее
  const controlThreshold = 52 - numAdvantage * 9; // 43/52/61
  const received = controlRoll >= controlThreshold;
  const numAdvLabel = numAdvantage > 0 ? `${atkFWCount}v${defDFCount} — численное преимущество` : numAdvantage < 0 ? `${atkFWCount}v${defDFCount} — прессинг защитников` : `${atkFWCount}v${defDFCount} — равно`;
  if (ms && ms[fw.id]) ms[fw.id].duels++;
  if (!received) {
    return {
      type: "counter",
      fw: {
        name: fw.name,
        pos: fw.pos,
        arch: ARCH[fw.archetype],
        tec: fw.tec,
        vis: fw.vis,
        controlBase,
        controlRoll
      },
      received: false,
      label: "🦵 ВЫНОС ВПЕРЁД"
    };
  }

  // б) Принял → прямой удар по воротам (FW vs GK)
  const shotBase = Math.round(fw.com * 0.52 + fw.tec * 0.33 + fw.vis * 0.15);
  const archBonus = AB.shot?.att[fw.archetype] || 0;
  const shotFinal = shotBase + archBonus;
  const gkBase = Math.round(recvGk.phy * 0.78 + recvGk.vis * 0.18 + recvGk.com * 0.04);
  const shotRoll = rnd(shotFinal, 24);
  const gkRoll = rnd(gkBase, 22);
  const goal = shotRoll > gkRoll;
  if (ms && ms[fw.id]) ms[fw.id].shots++;
  if (ms && ms[recvGk.id]) {
    if (!goal) ms[recvGk.id].saves++;
  }
  if (goal && ms && ms[fw.id]) ms[fw.id].goals++;
  // Ассист тому кто выбил мяч (защитник или вратарь)
  if (goal && clearerId && ms && ms[clearerId]) ms[clearerId].assists++;
  return {
    type: "counter",
    fw: {
      name: fw.name,
      pos: fw.pos,
      arch: ARCH[fw.archetype],
      tec: fw.tec,
      vis: fw.vis,
      controlBase,
      controlRoll,
      controlThreshold
    },
    gk: {
      name: recvGk.name,
      pos: recvGk.pos,
      arch: ARCH[recvGk.archetype],
      base: gkBase
    },
    received: true,
    clearerName,
    numAdvLabel,
    shotFinal,
    shotRoll,
    gkRoll,
    goal,
    label: "🦵 ВЫНОС ВПЕРЁД"
  };
}

// buildAttack now receives pre-built lineups instead of raw squads
// atkLU = buildLineup(activeSquad, tactic) — already assigned slots

function buildAttack(atkLU, defLU, aC, dC, aT, dT, aSyn, dSyn, ms) {

  const mf = pick(aMFs) || pick(aFWs) || atkLU.slots[0]?.player;

      type: "end",
      data: {
        label: "❌ Не хватает игроков",

        data: {

          isDefending: false

          type: "end",
          data: {
            label: "❌ АТАКА ПРОВАЛЕНА",
            note: "Центр не пройден"
          }
        });
        return {
          steps,
          goal: false
        };
      }
      steps.push({
        type: "info",
        data: {
          label: "🔄 МЯЧ ВОЗВРАЩЁН",

      type: "perfect_pass_cross",
